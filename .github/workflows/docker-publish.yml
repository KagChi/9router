name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Push built images to GHCR? (true/false)"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase GitHub repo name
        id: repo
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Get current unix timestamp
        id: timestamp
        uses: release-kit/unix-timestamp@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.registry }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=branch,suffix=-${{ steps.timestamp.outputs.timestamp }}
            type=sha,prefix=,suffix=,format=short

      - name: Determine if image should be pushed
        id: conditions
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-push=${{ inputs.push_to_registry }}" >> $GITHUB_OUTPUT
          else
            echo "should-push=${{ github.event_name != 'pull_request' }}" >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: ${{ steps.conditions.outputs.should-push == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.conditions.outputs.should-push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.repo.outputs.registry }}:buildcache
          cache-to: type=registry,ref=${{ steps.repo.outputs.registry }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false